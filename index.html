<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE SCIENCE OF SUNNY COUNTRY | OKAYAMA</title>
    <!-- 極太フォントをロード -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@900&family=Montserrat:wght@900&family=Noto+Sans+JP:wght@900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg: #000;
            --text: #fff;
            --vibrant-1: #ff3b30;
            --vibrant-2: #5856d6;
            --vibrant-3: #ffcc00;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            overflow-x: hidden;
            font-family: 'Inter', 'Noto Sans JP', sans-serif;
        }

        /* 巨大タイポグラフィの設定 */
        .big-text {
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            text-transform: uppercase;
            line-height: 0.85;
            letter-spacing: -0.06em;
            margin: 0;
            /* 背景を透過させてバイブラントなグラフィックを見せる効果もアリ */
        }

        /* 背景：バイブラント・グラフィック */
        .background-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            transition: background 1s ease;
        }

        .mountain-svg {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 60vh;
            filter: blur(40px); /* 境界をぼかしてより幻想的に */
            opacity: 0.8;
            transition: fill 1s ease;
        }

        /* スクロールセクション */
        .scroll-wrapper {
            height: 400vh;
        }

        section {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            padding: 0 5vw;
        }

        section.active {
            opacity: 1;
            pointer-events: all;
        }

        /* パネル：情報が飛んでくるギミック */
        .info-panel {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 40px;
            padding: 40px;
            position: absolute;
            width: 320px;
            transition: all 0.9s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* 配置のバリエーション */
        .pos-tl { transform: translate(-150vw, -150vh); top: 10%; left: 10%; }
        .pos-tr { transform: translate(150vw, -150vh); top: 10%; right: 10%; }
        .pos-bl { transform: translate(-150vw, 150vh); bottom: 10%; left: 10%; }
        .pos-br { transform: translate(150vw, 150vh); bottom: 10%; right: 10%; }

        /* Assembled状態（中央に集まる） */
        .assembled .info-panel { transform: translate(0, 0); }

        /* 巨大テキストのサイズ */
        .hero-title { font-size: clamp(5rem, 18vw, 15rem); }
        .sub-title { font-size: 1.5rem; letter-spacing: 0.2em; color: var(--vibrant-3); margin-bottom: 20px; }

        .tag {
            font-size: 0.7rem;
            letter-spacing: 0.5em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.5);
            margin-bottom: 1rem;
        }

        .highlight { color: var(--vibrant-1); }

    </style>
</head>
<body>

    <div class="background-container" id="bgContainer">
        <svg class="mountain-svg" viewBox="0 0 1000 1000" preserveAspectRatio="none">
            <path id="mountainPath" d="M0,1000 L0,600 L250,300 L500,700 L750,200 L1000,500 L1000,1000 Z" fill="url(#grad)" />
            <defs>
                <linearGradient id="grad" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" id="stop1" style="stop-color:var(--vibrant-1);stop-opacity:1" />
                    <stop offset="100%" id="stop2" style="stop-color:var(--vibrant-2);stop-opacity:1" />
                </linearGradient>
            </defs>
        </svg>
    </div>

    <div class="scroll-wrapper">
        <!-- Section 1: Impact Hero -->
        <section id="sec1" class="active">
            <div class="tag">IB MYP Research Project</div>
            <h1 class="big-text hero-title">SUNNY<br>LAND</h1>
            <p class="sub-title">OKAYAMA GEOGRAPHY</p>
        </section>

        <!-- Section 2: Data Gathering -->
        <section id="sec2">
            <h1 class="big-text" style="font-size: 6vw; text-align: center;">THE<br><span class="highlight">FACTORS</span></h1>
            
            <div class="info-panel pos-tl">
                <div class="tag">Natural Factor 01</div>
                <h3>中国山地</h3>
                <p>北側の冬の季節風を遮断。</p>
            </div>

            <div class="info-panel pos-tr">
                <div class="tag">Natural Factor 02</div>
                <h3>四国山地</h3>
                <p>南側の梅雨・台風を遮断。</p>
            </div>

            <div class="info-panel pos-bl">
                <div class="tag">Atmosphere</div>
                <h3>瀬戸内海式気候</h3>
                <p>降水量1mm未満の日数全国1位。</p>
            </div>

            <div class="info-panel pos-br">
                <canvas id="miniChart" style="height: 100px;"></canvas>
                <p style="font-size: 0.7rem; margin-top: 10px;">岡山 vs 全国の圧倒的な差</p>
            </div>
        </section>

        <!-- Section 3: Conclusion -->
        <section id="sec3">
            <h1 class="big-text" style="font-size: 10vw; text-align: left;">GEOGRAPHY<br>IS LOGIC.</h1>
            <p style="max-width: 600px; font-size: 1.2rem; line-height: 1.5; margin-top: 40px; font-weight: 300;">
                地形という「物理的な壁」が、気候という「現象」を生み、それが「晴れの国」という文化を創り出す。これは偶然ではなく、地理学的な必然である。
            </p>
        </section>
    </div>

    <script>
        const sections = document.querySelectorAll('section');
        const stop1 = document.getElementById('stop1');
        const stop2 = document.getElementById('stop2');

        window.addEventListener('scroll', () => {
            const scrollPos = window.scrollY;
            const wh = window.innerHeight;

            if (scrollPos < wh * 0.5) {
                activate(0);
                updateBg('#ff3b30', '#5856d6'); // 赤×紫
            } else if (scrollPos >= wh * 0.5 && scrollPos < wh * 2.5) {
                activate(1);
                updateBg('#5856d6', '#0071e3'); // 紫×青
                
                // パネル集結のトリガー
                if (scrollPos > wh * 1.2) {
                    sections[1].classList.add('assembled');
                } else {
                    sections[1].classList.remove('assembled');
                }
            } else {
                activate(2);
                updateBg('#ffcc00', '#ff3b30'); // 黄×赤
            }
        });

        function activate(index) {
            sections.forEach((s, i) => s.classList.toggle('active', i === index));
        }

        function updateBg(c1, c2) {
            stop1.style.stopColor = c1;
            stop2.style.stopColor = c2;
        }

        // 簡易グラフ
        const ctx = document.getElementById('miniChart').getContext('2d');
        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: ['Okayama', 'Other'],
                datasets: [{
                    data: [100, 60],
                    backgroundColor: ['#ffcc00', 'rgba(255,255,255,0.2)'],
                    borderRadius: 10
                }]
            },
            options: {
                responsive: true,
                plugins: { legend: { display: false } },
                scales: { x: { display: false }, y: { display: false } }
            }
        });
    </script>
</body>
</html>
